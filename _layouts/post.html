---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  {% if page.date %}
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  {% endif %}
  {{ content }}
</article>
<a class="back-link" href="{{ '/' | relative_url }}">← Retour à l'accueil</a>
